<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Palm Leaf Woven Pattern -->
    <pattern id="palmWeave" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="36" fill="#1b5e20"/>
      <rect x="0" y="1.5" width="36" height="16.5" rx="1.5" fill="#388e3c" stroke="#0e3814" stroke-width="0.6"/>
      <rect x="0" y="19.5" width="36" height="16.5" rx="1.5" fill="#388e3c" stroke="#0e3814" stroke-width="0.6"/>
      <rect x="1.5" y="0" width="16.5" height="19.5" rx="1.5" fill="#66bb6a" stroke="#0e3814" stroke-width="0.6"/>
      <rect x="19.5" y="18" width="16.5" height="19.5" rx="1.5" fill="#66bb6a" stroke="#0e3814" stroke-width="0.6"/>
      <line x1="9.7" y1="1.5" x2="9.7" y2="18" stroke="#c5e1a5" stroke-width="0.7" opacity="0.6"/>
      <line x1="27.7" y1="19.5" x2="27.7" y2="34.5" stroke="#c5e1a5" stroke-width="0.7" opacity="0.6"/>
    </pattern>

    <!-- Coconut Seed Gradient -->
    <linearGradient id="seedGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#84543d"/>
      <stop offset="50%" stop-color="#5a3321"/>
      <stop offset="100%" stop-color="#3b1d10"/>
    </linearGradient>

    <!-- Sprout Foliage Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="30%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="45%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </linearGradient>

    <!-- Bottom Wave Backdrop Gradient -->
    <linearGradient id="waveLightGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf7ed"/>
      <stop offset="100%" stop-color="#dceddc"/>
    </linearGradient>

    <!-- Contact Icons -->
    <g id="iconPhone">
      <circle cx="27" cy="27" r="27" fill="#0b411d"/>
      <path d="M19.5 15 C18.7 15 17.9 15.4 17.3 16 C15.7 17.6 15.1 19.6 15.1 21.8 C15.1 27 18.9 33 23.7 37.8 C28.5 42.6 34.5 46.4 39.7 46.4 C41.9 46.4 43.9 45.8 45.5 44.2 C46.7 43 46.7 41 45.5 39.8 L41.1 35.4 C39.9 34.2 38.1 34.2 36.9 35.4 L35.1 37.2 C34.7 37.6 34.1 37.8 33.5 37.4 C29.9 35.4 26.1 31.6 24.1 28 C23.7 27.4 23.9 26.8 24.3 26.4 L26.1 24.6 C27.3 23.4 27.3 21.6 26.1 20.4 L21.7 16 C21.1 15.4 20.3 15 19.5 15 Z" fill="#ffffff"/>
    </g>

    <g id="iconMail">
      <circle cx="27" cy="27" r="27" fill="#0b411d"/>
      <path d="M15 19 C13.3 19 12 20.3 12 22 L12 34 C12 35.7 13.3 37 15 37 L39 37 C40.7 37 42 35.7 42 34 L42 22 C42 20.3 40.7 19 39 19 L15 19 Z M16 22 L38 22 L27 29.5 L16 22 Z M15 24.5 L22.5 29.5 L15 34.5 L15 24.5 Z M39 24.5 L39 34.5 L31.5 29.5 L39 24.5 Z" fill="#ffffff"/>
    </g>

    <!-- Clean, Complete Globe Icon -->
    <g id="iconWeb">
      <circle cx="27" cy="27" r="27" fill="#0b411d"/>
      <circle cx="27" cy="27" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
      <line x1="13" y1="27" x2="41" y2="27" stroke="#ffffff" stroke-width="2"/>
      <line x1="27" y1="13" x2="27" y2="41" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="27" cy="27" rx="7.5" ry="14" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    </g>
  </defs>

  <style>
    .font-sans { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-script { font-family: 'Caveat', 'Segoe Script', 'Brush Script MT', cursive; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="1170" height="770" rx="28" fill="#ffffff" stroke="#0d4520" stroke-width="6"/>

  <!-- Top Right Leaves & Slogan -->
  <g transform="translate(900, 40)">
    <path d="M50 85 C40 50 15 30 10 25 C35 25 55 45 50 85 Z" fill="#388e3c"/>
    <path d="M50 85 C65 55 85 45 95 40 C95 65 75 80 50 85 Z" fill="#66bb6a"/>
    <path d="M50 85 Q50 105 45 115" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="55" class="font-script" font-size="34" font-weight="700" fill="#1b4d24" transform="rotate(-6 95 55)">Work Smart</text>
    <text x="90" y="95" class="font-script" font-size="34" font-weight="700" fill="#1b4d24" transform="rotate(-6 90 95)">Grow Together</text>
    <path d="M100 118 Q170 95 240 75" stroke="#2e7d32" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Official Logo (Left) -->
  <g transform="translate(50, 85) scale(0.88)">
    <path d="M 218,85 L 282,85 L 426,415 L 354,415 L 316,328 L 184,328 L 146,415 L 74,415 Z M 207,272 L 293,272 L 250,172 Z" 
          fill="url(#palmWeave)" stroke="#0e3a13" stroke-width="4" stroke-linejoin="round" fill-rule="evenodd"/>
    <g transform="translate(372, 368) scale(0.95)">
      <ellipse cx="-10" cy="12" rx="14" ry="7" fill="#09240d" opacity="0.3"/>
      <ellipse cx="0" cy="8" rx="23" ry="28" fill="url(#seedGrad)" stroke="#241209" stroke-width="2.2"/>
      <path d="M -11,-9 Q -18,8 -12,20" stroke="#3d1f12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M 0,-18 Q -3,8 0,34" stroke="#3d1f12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M 11,-9 Q 18,8 12,20" stroke="#3d1f12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M -2,-18 Q -1,-40 2,-55 Q 4,-40 3,-18 Z" fill="#7cb342"/>
      <path d="M 2,-53 C -7,-88 -2,-120 18,-138 C 18,-100 11,-75 2,-53 Z" fill="url(#sproutGrad)" stroke="#1b5e20" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 2,-53 Q 7,-100 18,-138" stroke="#c5e1a5" stroke-width="1.2" fill="none" opacity="0.7"/>
      <path d="M 0,-45 C -14,-62 -28,-72 -42,-75 C -30,-57 -14,-46 0,-33 Z" fill="url(#sproutGrad)" stroke="#1b5e20" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 3,-41 C 14,-58 26,-66 38,-70 C 28,-54 13,-43 1,-30 Z" fill="#388e3c" stroke="#1b5e20" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="390" y1="105" x2="390" y2="405" stroke="#2e7d32" stroke-width="1.8" opacity="0.6"/>

  <!-- Header Brand Text (Right) - Shifted slightly right to provide clear breathing room -->
  <g transform="translate(420, 0)" class="font-sans">
    <text x="0" y="200" font-size="94" font-weight="900" fill="#073b18" letter-spacing="3.5">ANNS</text>
    <text x="0" y="265" font-size="44" font-weight="800" fill="#073b18" letter-spacing="3">HEALTHY WEALTHY</text>
    <text x="0" y="320" font-size="36" font-weight="700" fill="#073b18" letter-spacing="3.8">CORPORATE SOLUTIONS</text>
    <line x1="0" y1="348" x2="710" y2="348" stroke="#2e7d32" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="380" font-size="20" font-weight="800" fill="#073b18" letter-spacing="3.5">SOFTWARE  •  AUTOMATION  •  BUSINESS SUPPORT</text>
    <!-- Tagline repositioned with zero sprout overlap -->
    <text x="0" y="416" font-size="21" font-weight="500" font-style="italic" fill="#073b18" letter-spacing="0.2">Simple digital solutions for real business needs.</text>
  </g>

  <!-- Contact Row -->
  <g transform="translate(65, 470)">
    <!-- Phone Group -->
    <use href="#iconPhone" x="0" y="0"/>
    <text x="68" y="36" class="font-sans" font-size="24" font-weight="800" fill="#073b18" letter-spacing="0.5">+91 94453 68843</text>

    <!-- Vertical Separator 1 -->
    <line x1="285" y1="2" x2="285" y2="52" stroke="#2e7d32" stroke-width="1.5" opacity="0.6"/>

    <!-- Email Group -->
    <use href="#iconMail" x="305" y="0"/>
    <text x="373" y="35" class="font-sans" font-size="19" font-weight="700" fill="#073b18" letter-spacing="0.2">annshealthywealthycorporatesol@gmail.com</text>

    <!-- Vertical Separator 2 -->
    <line x1="755" y1="2" x2="755" y2="52" stroke="#2e7d32" stroke-width="1.5" opacity="0.6"/>

    <!-- Website Group -->
    <use href="#iconWeb" x="775" y="0"/>
    <text x="843" y="24" class="font-sans" font-size="15.5" font-weight="700" fill="#073b18">https://annshealthywealthy</text>
    <text x="843" y="44" class="font-sans" font-size="15.5" font-weight="700" fill="#073b18">corporatesolutions.github.io/</text>
    <text x="843" y="64" class="font-sans" font-size="15.5" font-weight="700" fill="#073b18">anns-corporate-solutions/</text>
  </g>

  <!-- Bottom Panel -->
  <g transform="translate(55, 555)">
    <rect width="1090" height="170" rx="24" fill="url(#waveLightGreen)"/>

    <g transform="translate(780, 155) scale(0.9)" opacity="0.28">
      <path d="M 0,-15 Q -1,-40 2,-55 Q 4,-40 3,-15 Z" fill="#2e7d32"/>
      <path d="M 2,-53 C -10,-95 -2,-135 25,-160 C 22,-115 12,-85 2,-53 Z" fill="#388e3c"/>
      <path d="M 0,-45 C -18,-70 -35,-82 -55,-85 C -40,-65 -18,-50 0,-33 Z" fill="#4caf50"/>
      <path d="M 3,-41 C 18,-65 35,-75 50,-78 C 36,-60 18,-48 1,-30 Z" fill="#66bb6a"/>
    </g>

    <!-- Location Pin Icon -->
    <g transform="translate(85, 20)">
      <path d="M30 0 C13.4 0 0 13.4 0 30 C0 52.5 30 75 30 75 C30 75 60 52.5 60 30 C60 13.4 46.6 0 30 0 Z M30 40 C24.5 40 20 35.5 20 30 C20 24.5 24.5 20 30 20 C35.5 20 40 24.5 40 30 C40 35.5 35.5 40 30 40 Z" fill="#0b411d"/>
    </g>

    <line x1="190" y1="20" x2="190" y2="145" stroke="#0e3a13" stroke-width="1.8" opacity="0.6"/>

    <g transform="translate(220, 34)" class="font-sans" font-size="20" font-weight="700" fill="#073b18" letter-spacing="0.2">
      <text x="0" y="0">17/71C, Dharmapuram,</text>
      <text x="0" y="32">EATHAMOZHI, Raajaakkanangalam Post,</text>
      <text x="0" y="64">Nagercoil, Kanyakumari District 629501</text>
      <text x="0" y="96">Tamil Nadu, India</text>
    </g>

    <g transform="translate(890, 78) rotate(-14)">
      <text x="0" y="0" class="font-script" font-size="42" font-weight="700" fill="#073b18">Building</text>
      <text x="25" y="40" class="font-script" font-size="42" font-weight="700" fill="#073b18">a Better</text>
      <text x="35" y="80" class="font-script" font-size="42" font-weight="700" fill="#073b18">Tomorrow</text>
      <path d="M40 100 Q90 85 140 68" stroke="#073b18" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Corner Leaves -->
  <g transform="translate(18, 630)">
    <path d="M 0,130 C 50,70 120,40 145,130 Z" fill="#2e7d32" opacity="0.95"/>
    <path d="M 0,90 C 80,40 100,10 70,-40 C 30,10 0,60 0,90 Z" fill="#43a047"/>
    <path d="M 100,135 C 130,90 190,80 215,135 Z" fill="#81c784" opacity="0.8"/>
  </g>

  <!-- Dark Green Footer Bar -->
  <g transform="translate(28, 735)">
    <rect width="1144" height="42" rx="14" fill="#073b18"/>
    <rect x="5" y="4" width="1134" height="34" rx="11" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <g class="font-sans" font-size="16.5" font-weight="800" fill="#ffffff" letter-spacing="3.2">
      <line x1="50" y1="21" x2="140" y2="21" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>
      <text x="165" y="27">PEOPLE</text>
      <text x="275" y="26" opacity="0.6">|</text>
      <text x="310" y="27">PROCESS</text>
      <text x="430" y="26" opacity="0.6">|</text>
      <text x="465" y="27">TECHNOLOGY</text>
      <text x="625" y="26" opacity="0.6">|</text>
      <text x="660" y="27">SUSTAINABLE GROWTH</text>
      <line x1="945" y1="21" x2="1090" y2="21" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>
    </g>
  </g>
</svg>